name: Build TINA AI debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # lets you trigger a build manually from GitHub Mobile/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # google-services.json is required for Firebase and shouldn't be
      # committed to the repo (it's tied to your Firebase project). Store
      # its contents as a repo secret (Settings → Secrets and variables →
      # Actions → New repository secret, e.g. GOOGLE_SERVICES_JSON) and
      # write it out here before the build.
      - name: Write google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tina-ai-debug
          path: app/build/outputs/apk/debug/app-debug.apk
